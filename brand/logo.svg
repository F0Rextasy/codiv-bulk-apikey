<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="codiv-bulk logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#1B1233"/>
    </linearGradient>
    <linearGradient id="violet" x1="92" y1="140" x2="322" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#5B9DFF"/>
    </linearGradient>
    <linearGradient id="key" x1="272" y1="288" x2="424" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3DDC97"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="92" stroke="#7C6CFF" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Turnstile-style challenge ring: the gate every mint passes -->
  <g stroke="url(#violet)" fill="none">
    <circle cx="176" cy="196" r="112" stroke-width="10" stroke-opacity="0.9"/>
    <path d="M176 118a78 78 0 0 1 78 78" stroke-width="18" stroke-linecap="round"/>
    <circle cx="176" cy="196" r="52" stroke-width="10" stroke-opacity="0.55"/>
  </g>
  <circle cx="176" cy="84" r="13" fill="url(#violet)"/>

  <!-- arrow into the router -->
  <path d="M330 88h70m0 0-22-22m22 22-22 22" stroke="url(#violet)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- the minted key, proven and handed to 9Router -->
  <g transform="translate(272 288)" filter="url(#glow)">
    <rect x="0" y="0" width="152" height="96" rx="26" fill="url(#key)"/>
    <circle cx="42" cy="48" r="17" fill="none" stroke="#06121B" stroke-width="9"/>
    <rect x="64" y="40" width="62" height="16" rx="8" fill="#06121B"/>
    <rect x="100" y="40" width="12" height="30" rx="5" fill="#06121B"/>
    <rect x="122" y="40" width="12" height="22" rx="5" fill="#06121B"/>
  </g>

  <!-- 100M free input tokens: three stacked meter bars -->
  <g fill="url(#violet)">
    <rect x="72" y="336" width="200" height="14" rx="7" opacity="0.45"/>
    <rect x="72" y="362" width="164" height="14" rx="7" opacity="0.7"/>
    <rect x="72" y="388" width="200" height="14" rx="7"/>
  </g>
</svg>
